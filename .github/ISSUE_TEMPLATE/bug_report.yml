name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Remove personal paths, private hostnames/IPs, credentials, and sensitive app output before posting.
  - type: input
    id: version
    attributes:
      label: AppDock version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows version and Python version; do not include your Windows user name.
      placeholder: Windows 11, Python 3.11.9
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps using generic paths and public repositories where possible.
      placeholder: |
        1. Start AppDock with a disposable data directory
        2. Register a sample manifest
        3. ...
    validations:
      required: true
  - type: textarea
    id: sanitized_logs
    attributes:
      label: Sanitized logs
      description: Optional. Remove tokens, personal paths, hostnames, app names, and private data.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal paths, private hostnames/IPs, and sensitive app data.
          required: true
