name: Apply bounded WP6 correction

on:
  push:
    branches: [work/appdock-0.1.1-private-extension]

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write

jobs:
  apply-correction:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: work/appdock-0.1.1-private-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/appdock-0.1.1-private-extension
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Confirm the negative control fails on the reviewed implementation
        shell: bash
        run: |
          set +e
          python -m unittest -v tests/test_wp6_extension_content_identity.py > wp6-negative-control.txt 2>&1
          status=$?
          set -e
          tail -80 wp6-negative-control.txt
          if [ "$status" -eq 0 ]; then
            echo "The frozen implementation unexpectedly passed the same-signature negative control." >&2
            exit 1
          fi
      - name: Apply the content-authoritative cache correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("appdock.py")
          source = path.read_text(encoding="utf-8")
          old_annotation = """        self._last_config_signature: tuple[int, int, tuple[str, ...] | None] | None = None
          """
          new_annotation = """        self._last_config_signature: tuple[str, tuple[str, ...] | None] | None = None
          """
          old_disable = """    def _disable(self, error: str, signature: tuple[int, int, tuple[str, ...] | None] | None) -> ExtensionConfig:
          """
          new_disable = """    def _disable(self, error: str, signature: tuple[str, tuple[str, ...] | None] | None) -> ExtensionConfig:
          """
          old_loader = """        known = tuple(sorted(set(valid_app_ids))) if valid_app_ids is not None else None
                  try:
                      stat_result = path.stat()
                      signature = (stat_result.st_mtime_ns, stat_result.st_size, known)
                      if signature == self._last_config_signature:
                          return self._active
                      if not path.is_file() or path.is_symlink() or _is_link_or_reparse(path) or stat_result.st_size > MAX_EXTENSION_CONFIG_BYTES:
                          raise AppDockError(\"private extension configuration is invalid\")
                      raw = _loads_strict_json(path.read_text(encoding=\"utf-8\"))
          """
          new_loader = """        known = tuple(sorted(set(valid_app_ids))) if valid_app_ids is not None else None
                  signature: tuple[str, tuple[str, ...] | None] | None = None
                  try:
                      stat_result = path.stat()
                      if not path.is_file() or path.is_symlink() or _is_link_or_reparse(path) or stat_result.st_size > MAX_EXTENSION_CONFIG_BYTES:
                          raise AppDockError(\"private extension configuration is invalid\")
                      payload = path.read_bytes()
                      if len(payload) > MAX_EXTENSION_CONFIG_BYTES:
                          raise AppDockError(\"private extension configuration is invalid\")
                      signature = (hashlib.sha256(payload).hexdigest(), known)
                      if signature == self._last_config_signature:
                          return self._active
                      raw = _loads_strict_json(payload.decode(\"utf-8\"))
          """
          old_error = """                locals().get(\"signature\"),
          """
          new_error = """                signature,
          """

          replacements = (
              (old_annotation, new_annotation),
              (old_disable, new_disable),
              (old_loader, new_loader),
              (old_error, new_error),
          )
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"expected exactly one source match, found {source.count(old)}")
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")
          PY
      - name: Validate the corrected exact tree before committing
        shell: bash
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q appdock.py tests scripts
          node --check static/app.js
          node --test tests/test_ui_preview_races.js
          python scripts/privacy_scan.py
          python scripts/check_docs.py
          python scripts/build_portable.py --output dist/appdock-wp6-precommit.zip
          python scripts/privacy_scan.py --archive dist/appdock-wp6-precommit.zip
      - name: Append the bounded correction commit
        shell: bash
        run: |
          rm .github/workflows/wp6-apply.yml
          rm -f wp6-negative-control.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appdock.py .github/workflows/wp6-apply.yml
          git commit -m "fix: make extension config cache content-authoritative"
          git push origin "HEAD:${BRANCH}"
      - name: Dispatch exact-head CI and record its run
        shell: bash
        run: |
          final_sha=$(git rev-parse HEAD)
          gh workflow run ci.yml --ref "$BRANCH"
          run_id=""
          for _ in $(seq 1 30); do
            run_id=$(gh run list --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"${final_sha}\") | .databaseId" | head -1)
            if [ -n "$run_id" ]; then break; fi
            sleep 2
          done
          if [ -z "$run_id" ]; then
            echo "Unable to identify the dispatched exact-head CI run." >&2
            exit 1
          fi
          gh pr comment 1 --body "WP6 bounded correction committed at \`${final_sha}\`. Exact-head CI was dispatched as run \`${run_id}\`."
          echo "final_sha=${final_sha}"
          echo "run_id=${run_id}"
