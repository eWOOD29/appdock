name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PACKAGE_DIR: ${{ runner.temp }}/appdock-package
      PACKAGE_ARCHIVE: ${{ runner.temp }}/appdock-package/appdock-windows.zip
      CHECKSUM_FILE: ${{ runner.temp }}/appdock-package/SHA256SUMS.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Verify version tag
        shell: pwsh
        run: |
          $expected = 'v' + (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "Tag $env:GITHUB_REF_NAME does not match $expected" }
      - name: Test
        run: python -m unittest discover -s tests -q
      - name: Compile and JavaScript checks
        run: |
          python -m compileall -q appdock.py tests scripts
          node --check static/app.js
          node --test tests/test_ui_preview_races.js
      - name: Privacy scan
        run: python scripts/privacy_scan.py
      - name: Documentation links
        run: python scripts/check_docs.py
      - name: Build portable release
        run: python scripts/build_portable.py --output "$env:PACKAGE_ARCHIVE"
      - name: Scan exact archive privacy
        run: python scripts/privacy_scan.py --archive "$env:PACKAGE_ARCHIVE"
      - name: Verify release inventory
        run: python -c "from pathlib import Path; import appdock, os; appdock.validate_zip(Path(os.environ['PACKAGE_ARCHIVE']).read_bytes())"
      - name: Upload tested Windows release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-windows-release
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/appdock-package/appdock-windows.zip
            ${{ runner.temp }}/appdock-package/SHA256SUMS.txt

  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PACKAGE_DIR: ${{ runner.temp }}/appdock-package
      PACKAGE_ARCHIVE: ${{ runner.temp }}/appdock-package/appdock-windows.zip
      CHECKSUM_FILE: ${{ runner.temp }}/appdock-package/SHA256SUMS.txt
    steps:
      - name: Download tested Windows release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tested-windows-release
          path: ${{ runner.temp }}/appdock-package
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @(
            'release', 'create', $env:GITHUB_REF_NAME,
            $env:PACKAGE_ARCHIVE, $env:CHECKSUM_FILE,
            '--verify-tag', '--generate-notes',
            '--title', "AppDock $env:GITHUB_REF_NAME"
          )
          if ($env:GITHUB_REF_NAME -eq 'v0.1.1') {
            $arguments += @(
              '--notes',
              "Updating from v0.1.0: install v0.1.1 manually using the verified ZIP and scripts/install.ps1. The v0.1.0 one-click updater intentionally rejects v0.1.1's release-inventory schema. See docs/MIGRATING.md."
            )
          }
          & gh @arguments
