name: Temporary AppDock restart-readiness diagnostic

on:
  push:
    branches:
      - feat/appdock-v0.2.0
    paths:
      - .github/workflows/_appdock_ready_diag.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/appdock-v0.2.0
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          check-latest: false
      - name: Reproduce focused readiness failure and print helper log
        shell: pwsh
        run: |
          @'
          import sys
          import traceback
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "tests"))
          from test_release_hardening import ReleaseHardeningTests

          case = ReleaseHardeningTests("test_update_helper_accepts_restart_only_after_appdock_health_is_ready")
          case.setUp()
          try:
              case.test_update_helper_accepts_restart_only_after_appdock_health_is_ready()
              print("FOCUSED_RESULT=PASS")
          except BaseException:
              print("FOCUSED_RESULT=FAIL")
              traceback.print_exc()
              log = case.config.data_root / "runtime" / "update.log"
              print("UPDATE_LOG_BEGIN")
              print(log.read_text(encoding="utf-8") if log.exists() else "<missing>")
              print("UPDATE_LOG_END")
          finally:
              case.tearDown()
          '@ | python -
      - name: Remove diagnostic workflow
        shell: bash
        run: |
          rm .github/workflows/_appdock_ready_diag.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/_appdock_ready_diag.yml
          git commit -m "chore: remove restart readiness diagnostic"
          git push origin HEAD:feat/appdock-v0.2.0
