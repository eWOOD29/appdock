name: Apply WP4 remediation

on:
  push:
    branches: [work/appdock-0.1.1-private-extension]
    paths: [.github/workflows/wp4-apply.yml]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/appdock-0.1.1-private-extension
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Retrieve and verify bounded patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, os, urllib.request
          from pathlib import Path
          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/issues/1/comments?per_page=100',
              headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              comments = json.load(response)
          parts, comment_ids = {}, []
          for comment in comments:
              body = str(comment.get('body') or '')
              if body.startswith('WP4_PATCH_PART_1_OF_2\n'):
                  parts[1] = body.split('\n', 1)[1].strip()
                  comment_ids.append(int(comment['id']))
              elif body.startswith('WP4_PATCH_PART_2_OF_2\n'):
                  parts[2] = body.split('\n', 1)[1].strip()
                  comment_ids.append(int(comment['id']))
          if set(parts) != {1, 2}:
              raise SystemExit('bounded WP4 patch parts are missing')
          compressed = base64.b64decode(parts[1] + parts[2], validate=True)
          expected = '23e470fd9f0c1237aeb047a5625c38a06388e1adb714a54d3ea0b582416caf2a'
          if hashlib.sha256(compressed).hexdigest() != expected:
              raise SystemExit('bounded WP4 patch checksum mismatch')
          Path('/tmp/wp4.patch').write_bytes(gzip.decompress(compressed))
          Path('/tmp/wp4-comment-ids.json').write_text(json.dumps(comment_ids))
          PY
      - name: Apply remediation patch
        run: |
          rm -f .github/workflows/ci.yml tests/test_extensions_and_migration.py tests/test_wp4_remediation.py
          patch -p1 --batch --forward < /tmp/wp4.patch
          rm -f .github/workflows/wp4-apply.yml
      - name: Validate exact remediation tree
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q appdock.py tests scripts
          node --check static/app.js
          node --test tests/test_ui_preview_races.js
          python scripts/privacy_scan.py
          python scripts/check_docs.py
          python scripts/build_portable.py --output dist/appdock-windows.zip
          python scripts/privacy_scan.py --archive dist/appdock-windows.zip
          python -c "from pathlib import Path; import appdock; appdock.validate_zip(Path('dist/appdock-windows.zip').read_bytes())"
      - name: Remove transport comments
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          for comment_id in json.loads(Path('/tmp/wp4-comment-ids.json').read_text()):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/issues/comments/{comment_id}',
                  method='DELETE',
                  headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'},
              )
              with urllib.request.urlopen(request, timeout=30):
                  pass
          PY
      - name: Commit coherent remediation
        if: success()
        run: |
          rm -rf dist __pycache__ scripts/__pycache__ tests/__pycache__
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: remediate independent review findings"
          git push origin HEAD:work/appdock-0.1.1-private-extension
