name: Temporary AppDock helper staged-path alias fix

on:
  push:
    branches:
      - feat/appdock-v0.2.0
    paths:
      - .github/workflows/_appdock_helper_alias_fix.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/appdock-v0.2.0
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          check-latest: false
      - name: Apply exact staged receipt identity fix
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("scripts/update_helper.py")
          source = path.read_text(encoding="utf-8")
          old = '    if receipt is not None and Path(receipt["path"]).expanduser().absolute() != staged.expanduser().absolute():\n'
          new = '    if receipt is not None and Path(receipt["path"]).expanduser().resolve() != staged.expanduser().resolve():\n'
          if source.count(old) != 1:
              raise SystemExit("expected helper staged receipt comparison not found exactly once")
          with path.open("w", encoding="utf-8", newline="\n") as stream:
              stream.write(source.replace(old, new))
          '@ | python -
          git diff --check
      - name: Run exact hosted Windows regressions
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Get-Location).Path
          Push-Location tests
          python -m unittest test_release_hardening.ReleaseHardeningTests.test_update_helper_accepts_restart_only_after_appdock_health_is_ready -v
          Pop-Location
          python -m unittest discover -s tests -p "test_update_lock_alias_regression.py" -v
      - name: Commit bounded production fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update_helper.py
          git commit -m "fix: canonicalize helper staged receipt identity"
          git push origin HEAD:feat/appdock-v0.2.0
